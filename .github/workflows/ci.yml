name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci

      - name: Audit Node.js dependencies
        run: |
          npm audit --audit-level=high
          npm --prefix server audit --audit-level=high

      - name: Lint, test and build
        run: |
          npm run lint
          npm --prefix server test
          npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Test and audit Python dependencies
        run: |
          python -m pip install --requirement services/ai_gateway/requirements.txt pip-audit
          python -m unittest discover -s services/ai_gateway/tests -p 'test_*.py'
          pip-audit --requirement services/ai_gateway/requirements.txt

      - name: Scan current source for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
